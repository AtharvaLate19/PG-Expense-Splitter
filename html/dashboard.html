<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PG Expense Splitter Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5faff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .side-nav {
      min-width: 220px;
      background: #0d6efd;
      color: #fff;
      min-height: 100vh;
      flex-direction: column;
      padding-top: 2rem;
      position: fixed;
      left: 0; top: 0; bottom: 0;
    }
    .side-nav .nav-link {
      color: #fff;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      transition: background 0.2s ease;
    }
    .side-nav .nav-link.active,
    .side-nav .nav-link:hover {
      background: #2563eb;
      border-radius: 0.25rem;
      color: #fff;
    }
    .profile-btn {
      position: absolute;
      right: 2rem;
      top: 1.2rem;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .profile-btn img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #0d6efd;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .profile-btn img:hover {
      transform: scale(1.08);
    }
    .main-content {
      margin-left: 220px;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
      margin-bottom: 2rem;
    }
    .admin-label {
      font-size: 0.9rem;
      padding: 2px 8px;
      background: #eaffea;
      color: #198754;
      border-radius: 6px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <!-- Side navigation -->
  <div class="side-nav d-flex flex-column align-items-start px-3">
    <a href="#" class="nav-link active" id="nav-welcome">Welcome</a>
    <a href="#" class="nav-link" id="nav-group">Group</a>
    <a href="#" class="nav-link" id="nav-logout">Logout</a>
  </div>

  <!-- Top profile button (using a face-like avatar image) -->
  <button class="profile-btn" id="profileButton">
    <img src="https://e7.pngegg.com/pngimages/343/677/png-clipart-computer-icons-user-profile-login-my-account-icon-heroes-black-thumbnail.png" alt="Profile Avatar">
  </button>

  <!-- Main content -->
  <div class="main-content">
    <!-- Welcome Page -->
    <div id="welcomePage">
      <h2>Welcome to Your PG Group</h2>
      <div class="card p-3 mt-3">
        <p><b>Group Code:</b> <span id="groupCode">PG123456G1</span></p>
        <h5 class="mt-4 mb-2">Expense Status</h5>
        <table class="table table-bordered text-center align-middle">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="expenseStatus"></tbody>
        </table>
      </div>
    </div>

    <!-- Group Page -->
    <div id="groupPage" style="display:none;">
      <h2>Group Details</h2>
      <div class="card p-3 mt-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <h4 id="groupName">Group Name</h4>
            <span id="adminLabel" class="admin-label" style="display:none;">Admin</span>
          </div>
          <button class="btn btn-primary btn-sm" id="editGroupBtn" style="display:none;">Edit</button>
        </div>
        <p id="groupDescription">Description goes here...</p>

        <h5 class="mt-4 mb-3">Members</h5>
        <ul class="list-group mb-3" id="memberList"></ul>

        <div id="adminControls" style="display:none;">
          <button class="btn btn-primary mb-2" id="addExpenseBtn">Add Expense</button>
          <button class="btn btn-danger mb-2" id="removeMemberBtn">Remove Member</button>
          <button class="btn btn-success mb-2" id="addMemberBtn">Add Member</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="profileForm">
          <div class="modal-header">
            <h5 class="modal-title" id="profileModalLabel">Profile</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <label class="form-label">Username</label>
            <input type="text" id="profileUsername" class="form-control mb-3" required>
            <label class="form-label">New Password</label>
            <input type="password" id="profilePassword" class="form-control mb-3">
            <hr>
            <h6>Delete Account</h6>
            <input type="password" placeholder="Type password to delete" class="form-control mb-2" id="deletePassword">
            <button type="button" class="btn btn-outline-danger btn-sm" id="deleteAccountBtn">Delete Account</button>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Dashboard JavaScript -->
  <script>
    const groupDetails = {
      groupCode: '123456',
      name: 'Night Owls',
      description: 'A bunch of night owls sharing a home!',
      members: [
        {name: 'Ravi (You)', status: 'Paid', amount: 1200, isAdmin: true},
        {name: 'Suraj', status: 'Pending', amount: 1200, isAdmin: false},
        {name: 'Zara', status: 'Paid', amount: 1200, isAdmin: false}
      ]
    };
    let isCurrentUserAdmin = true;

    // Populate Welcome Page
    document.getElementById('groupCode').innerText = groupDetails.groupCode;
    function renderExpenseStatus() {
      const tbody = document.getElementById('expenseStatus');
      tbody.innerHTML = '';
      groupDetails.members.forEach(member => {
        tbody.innerHTML += `
          <tr>
            <td>${member.name}${member.isAdmin ? ' <span class="admin-label">Admin</span>' : ''}</td>
            <td>${member.status === "Paid" ? '<span class="text-success">Paid</span>' : '<span class="text-danger">Pending</span>'}</td>
            <td>${member.amount}</td>
          </tr>
        `;
      });
    }
    renderExpenseStatus();

    // Populate Group Page
    document.getElementById('groupName').innerText = groupDetails.name;
    document.getElementById('groupDescription').innerText = groupDetails.description;
    function renderMembers() {
      const list = document.getElementById('memberList');
      list.innerHTML = '';
      groupDetails.members.forEach(member => {
        list.innerHTML += `
          <li class="list-group-item d-flex justify-content-between align-items-center">
            ${member.name}
            ${member.isAdmin ? '<span class="admin-label">Admin</span>' : ''}
          </li>
        `;
      });
    }
    renderMembers();

    // Admin Controls
    if (isCurrentUserAdmin) {
      document.getElementById('adminLabel').style.display = 'inline-block';
      document.getElementById('editGroupBtn').style.display = 'inline-block';
      document.getElementById('adminControls').style.display = 'block';
    }

    // Navigation
    const pages = {
      welcome: document.getElementById('welcomePage'),
      group: document.getElementById('groupPage'),
    };
    document.getElementById('nav-welcome').onclick = () => {
      showPage('welcome'); setActive('nav-welcome');
    };
    document.getElementById('nav-group').onclick = () => {
      showPage('group'); setActive('nav-group');
    };
    document.getElementById('nav-logout').onclick = () => {
      window.location.href = 'home page2.html'; // ✅ Redirect to login page
    };

    function showPage(page) {
      for (let key in pages) pages[key].style.display = 'none';
      pages[page].style.display = 'block';
    }
    function setActive(id) {
      document.querySelectorAll('.side-nav .nav-link').forEach(link => link.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Profile Modal
    var profileModal = new bootstrap.Modal(document.getElementById('profileModal'));
    document.getElementById('profileButton').onclick = () => {
      document.getElementById('profileUsername').value = 'Ravi';
      document.getElementById('profilePassword').value = '';
      profileModal.show();
    };

    document.getElementById('profileForm').onsubmit = function(e) {
      e.preventDefault();
      profileModal.hide();
      alert('Profile updated!');
    };

    document.getElementById('deleteAccountBtn').onclick = function() {
      const pwd = document.getElementById('deletePassword').value;
      if (pwd.trim() === '') {
        alert('Please enter password');
        return;
      }
      if (confirm('Are you sure you want to delete your account?')) {
        window.location.href = 'loginpage.html';
      }
    };

    // Edit/Add/Remove group features
    document.getElementById('editGroupBtn').onclick = function() {
      const newName = prompt("Edit group name:", groupDetails.name);
      if (newName) groupDetails.name = newName;
      const newDesc = prompt("Edit group description:", groupDetails.description);
      if (newDesc) groupDetails.description = newDesc;
      document.getElementById('groupName').innerText = groupDetails.name;
      document.getElementById('groupDescription').innerText = groupDetails.description;
    };
    document.getElementById('addExpenseBtn').onclick = () => alert('Open add expense modal (to be implemented)');
    document.getElementById('removeMemberBtn').onclick = () => alert('Open remove member modal (to be implemented)');
    document.getElementById('addMemberBtn').onclick = () => alert('Open add member modal (to be implemented)');

    // Initially show Welcome Page
    showPage('welcome');
    setActive('nav-welcome');
  </script>
</body>
</html>
